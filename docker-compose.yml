services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      target: prod
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/asset_management.db
      SEED_ON_STARTUP: "false"
      BACKUPS_DIR: /app/data/backups
      REDIS_URL: redis://redis:6379/0
    volumes:
      - backend_data:/app/data
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  celery-worker:
    build:
      context: ./backend
      target: prod
    command: uv run celery -A app.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/asset_management.db
      BACKUPS_DIR: /app/data/backups
      REDIS_URL: redis://redis:6379/0
    volumes:
      - backend_data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  celery-beat:
    build:
      context: ./backend
      target: prod
    command: uv run celery -A app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/asset_management.db
      BACKUPS_DIR: /app/data/backups
      REDIS_URL: redis://redis:6379/0
    volumes:
      - backend_data:/app/data
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
